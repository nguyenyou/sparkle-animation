<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    /* Simple in-place sparkle: just fade in/out, no movement or scaling */
    @keyframes sparklePulse {
      0%, 20% {
        opacity: 0;
      }
      40%, 60% {
        opacity: 1;
      }
      80%, 100% {
        opacity: 0;
      }
    }

    .sparkle {
      position: absolute;
      right: -50px;
      top: 0;
      background-color: black;
    }

    /* New comparison icon placement (stacked below the original) */
    .sparkle-comparison {
      margin-top: 120px;
    }

    .sparkle-svg {
      stroke: #ffffff;
      fill: #ffffff;
      filter: drop-shadow(0 0 14px rgba(120, 190, 255, 0.9));
      transform-box: fill-box;
      transform-origin: center;
    }

    /* Each sparkle stays fixed, but takes turns blinking */
    #sparkle1 {
      animation: sparklePulse 3.5s ease-in-out infinite;
    }

    #sparkle2 {
      animation: sparklePulse 3.5s ease-in-out infinite;
      animation-delay: 1.1s;
    }

    #sparkle3 {
      animation: sparklePulse 3.5s ease-in-out infinite;
      animation-delay: 2.2s;
    }

    /* New 16x16 sparkle icon parts */
    #sparkleIcon-main,
    #sparkleIcon-mid,
    #sparkleIcon-small {
      animation: sparklePulse 3.5s ease-in-out infinite;
    }

    #sparkleIcon-mid {
      animation-delay: 0.8s;
    }

    #sparkleIcon-small {
      animation-delay: 1.6s;
    }

    .hero-img {
      width: 650px;
      position: relative;
    }

    .hero-img img {
      width: 100%;
      margin: 20px;
    }

    body {
      background: white;
      color: oklch(0.5371 0.0337 264.24);
    }
  </style>
</head>
