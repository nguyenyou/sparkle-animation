    <title>Document</title>
    <style>
      /* Simple in-place sparkle: just fade in/out, no movement or scaling */
      @keyframes sparklePulse {
        0%,
        20% {
          opacity: 0;
        }
        40%,
        60% {
          opacity: 1;
        }
        80%,
        100% {
          opacity: 0;
        }
      }

      /* ===============================
       Sparkle icon animation configuration
       - Change the values in :root below
         to control timing & order
       =============================== */
      :root {
        /* Duration and order for the 16x16 comparison icon parts */
        --icon-duration: 2s; /* was 3.5s – faster overall cycle */

        /* Adjust these to change sequence for sparkleIcon-main/mid/small
         - main (largest) appears first
         - mid (second-largest) appears next
         - small appears last */
        --icon-delay-main: 0s;
        --icon-delay-mid: 0.4s;
        --icon-delay-small: 0.8s;
      }

      /* 16x16 sparkle icon parts
       - To change speed: edit --icon-duration in :root
       - To change order: edit --icon-delay-* in :root */
      #sparkleIcon-main,
      #sparkleIcon-mid,
      #sparkleIcon-small {
        animation: sparklePulse var(--icon-duration) ease-in-out infinite;
      }

      #sparkleIcon-main {
        animation-delay: var(--icon-delay-main);
      }

      #sparkleIcon-mid {
        animation-delay: var(--icon-delay-mid);
      }

      #sparkleIcon-small {
        animation-delay: var(--icon-delay-small);
      }

      body {
        background: white;
        color: oklch(0.5371 0.0337 264.24);
        display: grid;
        place-items: center;
        height: 100vh;
      }



      
    </style>

    <style>
      .ai-thinking-text {
        will-change: background-position;
        background-clip: text;
        -webkit-background-clip: text;
        color: transparent;
        background-image: linear-gradient(
          105deg,
          color-mix(in oklab, black 20%, transparent) 0% 40%,
          black 50%,
          color-mix(in oklab, black 20%, transparent) 60% 100%
        );
        background-size: 200% auto;
        background-position: -50%;
        animation: ai-thinking-text 1.8s ease-in-out infinite;
      }

      @keyframes ai-thinking-text {
        0% {
          background-position: 150%;
        }
        100% {
          background-position: -50%;
        }
      }
    </style>
  </head>
